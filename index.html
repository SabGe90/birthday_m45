<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geburtstag</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1b1530, #3a2158);
      color: white;
      overflow: hidden;
    }

    .container {
      padding: 30px;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      opacity: 0;
      transform: translateY(30px);
      transition: all 1.5s ease;
    }

    h1.visible {
      opacity: 1;
      transform: translateY(0);
    }

    button {
      padding: 16px 30px;
      font-size: 1.2rem;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      background: white;
      color: #3a2158;
    }

    .balloon {
      position: fixed;
      bottom: -100px;
      font-size: 55px;
      animation: fly 6s linear forwards;
    }

    @keyframes fly {
      to {
        transform: translateY(-120vh);
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1 id="birthdayText">
      Aaaalles Gute zum 45. Geburtstag, Malte 🎉!!
    </h1>

    <audio id="musik" loop>
      <source src="Andrius.mp3" type="audio/mpeg">
    </audio>

    <button id="musikButton">🎵 Let's Fetz</button>

  </div>

  <script>
    const musik = document.getElementById("musik");
    const button = document.getElementById("musikButton");
    const birthdayText = document.getElementById("birthdayText");

    button.addEventListener("click", function () {

      musik.play();

      button.style.display = "none";

      setTimeout(() => {
        birthdayText.classList.add("visible");
      }, 500);

      for (let i = 0; i < 15; i++) {
        setTimeout(createBalloon, i * 300);
      }

    });

    function createBalloon() {

      const balloon = document.createElement("div");

      balloon.classList.add("balloon");

      balloon.innerText = "🎈";

      balloon.style.left =
        Math.random() * 95 + "vw";

      document.body.appendChild(balloon);

      setTimeout(() => {
        balloon.remove();
      }, 7000);
    }
  </script>

</body>
</html>
